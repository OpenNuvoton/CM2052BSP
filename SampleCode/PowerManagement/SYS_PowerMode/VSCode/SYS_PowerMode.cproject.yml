project:
  packs:
    - pack: Nuvoton::NuMicroCM23_DFP
  setups:
    - output:
        # bin, elf, hex, lib
        type: bin
    - setup: Options for SYSPowerMode
      add-path:
        - ../../../../Library/Device/Nuvoton/cm2052/Include
        - ../../../../Library/StdDriver/inc
        - ../../../../Library/CMSIS/Core/Include
      misc:
        - for-compiler: AC6
          C:
            - -std=c11 -fno-rtti -funsigned-char -fshort-enums -fshort-wchar -ffunction-sections -fdata-sections -Wall
            - -D__MICROLIB
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib --map --load_addr_map_info --symbols
            - --info sizes --info totals --strict --summary_stderr --info summarysizes
        - for-compiler: GCC
          C:
            - -std=gnu11 -mthumb -masm-syntax-unified -fmessage-length=0 -fsigned-char -ffunction-sections -fdata-sections
          Link:
            - -mthumb -fmessage-length=0 -fsigned-char --specs=nano.specs --specs=nosys.specs
            - -Wl,--gc-sections,-Map="$elf()$.map"
            - -Wl,--no-warn-rwx-segments
  linker:
    - script: ../../../../Library/Device/Nuvoton/cm2052/Source/ARM/APROM.sct
      for-compiler: AC6
    - script: ../../../../Library/Device/Nuvoton/cm2052/Source/GCC/gcc_arm.ld
      for-compiler: GCC
  groups:
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/system_cm2052.c
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/ARM/startup_cm2052.c
          for-compiler: AC6
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/GCC/startup_cm2052.S
          for-compiler: GCC
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/GCC/_syscalls.c
          for-compiler: GCC
    - group: User
      files:
        - file: ../main.c
    - group: Library
      files:
        - file: ../../../../Library/StdDriver/src/retarget.c
        - file: ../../../../Library/StdDriver/src/clk.c
        - file: ../../../../Library/StdDriver/src/sys.c
        - file: ../../../../Library/StdDriver/src/uart.c
        - file: ../../../../Library/StdDriver/src/wdt.c
