project:
  packs:
    - pack: Nuvoton::NuMicroCM23_DFP
  setups:
    - output:
        # bin, elf, hex, lib
        type: bin
    - setup: Options for ISPMSC
      add-path:
        - ../../../../Library/Device/Nuvoton/cm2052/Include
        - ../../../../Library/CMSIS/Core/Include
        - ../../../../Library/StdDriver/inc
      misc:
        - for-compiler: AC6
          C:
            - -std=c11 -fno-rtti -funsigned-char -fshort-enums -fshort-wchar -ffunction-sections -fdata-sections -Wall
            - -D__MICROLIB
          ASM:
            - -masm=auto
          Link:
            - --library_type=microlib --map --load_addr_map_info --symbols
            - --info sizes --info totals --strict --summary_stderr --info summarysizes
  linker:
    - script: ../../../../Library/Device/Nuvoton/cm2052/Source/ARM/LDROM.sct
      for-compiler: AC6
  groups:
    - group: User
      files:
        - file: ../main.c
        - file: ../DataFlashProg.c
        - file: ../descriptors.c
        - file: ../MassStorage.c
        - file: ../usbd_user.c
    - group: CMSIS
      files:
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/ARM/startup_cm2052_isp.c
          for-compiler: AC6
        - file: ../../../../Library/Device/Nuvoton/cm2052/Source/system_cm2052.c
